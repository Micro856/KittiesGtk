name: Build Nightly

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  flatpak:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: kitties.flatpak
          manifest-path: io.github.Micro856.KittiesGtkDevel.json
          arch: ${{ matrix.variant.arch }}
          verbose: true
